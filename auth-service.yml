server:
  port: 9001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/quizhub_auth
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info