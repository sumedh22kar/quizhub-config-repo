spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:9001
              predicates:
                - Path=/api/v1/auth/**
            - id: quiz-service
              uri: http://localhost:9002
              predicates:
                - Path=/api/v1/quizzes/**
            - id: question-service
              uri: http://localhost:9003
              predicates:
                - Path=/api/v1/questions/**

